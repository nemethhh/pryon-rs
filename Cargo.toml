[workspace]
resolver = "2"
members = ["pryon", "pryon-ffi", "pryon-cli", "pryon-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
repository = "https://github.com/nemethhh/pryon-rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
